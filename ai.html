
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA AI</title>
    <link rel="stylesheet" href="ai-chat.css">
</head>
<body>

    <header class="topbar">
        <a href="index.html" class="back">← NEXORA</a>
        <div class="brand">NEXORA <span>AI</span></div>
        <div class="status">● ONLINE</div>
    </header>

    <main class="chat-container">

        <section class="welcome">
            <div class="orb">N</div>
            <h1>Meet NEXORA AI</h1>
            <p>Your personal language assistant.</p>
            <p class="small">The more you use it, the more it can personalize its responses.</p>
        </section>

        <section id="chatMessages" class="messages">
            <div class="message ai">
                <strong>NEXORA AI</strong>
                <p>Hey! Welcome to NEXORA AI. What shall we work on today?</p>
            </div>
        </section>

        <div class="input-area">
            <input
                id="userInput"
                type="text"
                placeholder="Message NEXORA AI..."
                autocomplete="off"
            >
            <button id="sendButton">Send ↑</button>
        </div>

        <div class="bottom-note">
            NEXORA AI v1.1 · Personalized Language Engine
        </div>

    </main>

    <script src="nexora_ai.js"></script>
    <script src="ai-chat.js"></script>
</body>
</html>
